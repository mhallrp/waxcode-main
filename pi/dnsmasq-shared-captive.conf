# Installed as /etc/NetworkManager/dnsmasq-shared.d/captive.conf
#
# Makes the box's own setup network a captive portal: every name a joined phone looks up resolves to
# the box, so the probe each OS fires after joining lands on our HTTP server, which answers it with a
# redirect (see CAPTIVE_PROBE_PATHS in server/src/http-api.js) and the phone opens setup in a sheet.
#
# WHY THIS IS WORTH A FILE IN /etc. Without it the setup network still works, but only for someone
# who has been told to open an address - and the whole point of AP mode is a box that can be set up
# by a person holding nothing but a phone, with nobody to tell them anything. The instruction you do
# not have to give is the one that cannot be got wrong.
#
# WHY NOTHING HERE NAMES THE BOX. There was a line answering waxcodedvs.local with this address, and
# it was removed on purpose (2026-10-11). Setup lives on the IP now, so the box's NAME is never
# resolved while a phone is on this network - because that answer stops being true the moment the
# box leaves, and a phone holding it cannot reach the box on the network it just joined. Wifi setup
# is the one flow that must leave nothing behind in a resolver.
#
# WHY IT IS SAFE TO APPLY UNCONDITIONALLY. dnsmasq-shared.d is read ONLY for NetworkManager
# connections in `shared` mode, and the only shared connection this box ever has is its own setup
# hotspot. In station mode - which is every normal minute of the box's life - this file is not read
# at all and resolution is untouched.
#
# `address=/#/` is dnsmasq's catch-all: every name not otherwise matched answers with this address,
# which is the one NetworkManager gives a shared wireless connection. The address is fixed by
# NetworkManager, not chosen here.
#
# Install (provisioning does this for you):
#   sudo install -m 0644 -o root -g root dnsmasq-shared-captive.conf \
#       /etc/NetworkManager/dnsmasq-shared.d/captive.conf

address=/#/10.42.0.1
