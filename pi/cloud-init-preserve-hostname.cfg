# Waxcode: the hostname is set by pi/provision.sh and must survive whatever Imager was told.
#
# This image ships cloud-init, so once an os_list.json offers the box through Raspberry Pi Imager
# the customisation panel is reachable - hostname, user, password, Wi-Fi. The user and password
# fields are harmless: cloud-init's default_user is `pi`, which does not exist here, so a name
# typed there CREATES an account and leaves the box's own uid 1000 alone.
#
# Hostname is not harmless. set_hostname and update_hostname are both in the module list and
# preserve_hostname defaults to false, so whatever was typed would win - and every instruction this
# project gives says to open waxcode.local. A box answering to a name nobody was told is
# indistinguishable from a broken one.
preserve_hostname: true
