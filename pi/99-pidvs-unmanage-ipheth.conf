# /etc/NetworkManager/conf.d/99-pidvs-unmanage-ipheth.conf
#
# Stops NetworkManager auto-connecting the phone's USB tethering interface (driver: ipheth) the instant it appears - an unscoped catch-all
# Ethernet profile was auto-connecting it on every dock, triggering iOS's "Personal Hotspot in use" indicator.
#
# Scoped by driver, not interface name. Requires a physical unplug/replug (not just a config reload) to take effect the first time it's
# installed - NetworkManager only evaluates managed status on fresh device appearance.
#
# Install:
#   sudo cp 99-pidvs-unmanage-ipheth.conf /etc/NetworkManager/conf.d/99-pidvs-unmanage-ipheth.conf
#   sudo systemctl restart NetworkManager
#   (then physically unplug/replug the dock cable once - see note above)

[device-ipheth]
match-device=driver:ipheth
managed=0
