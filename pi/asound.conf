# /etc/asound.conf - per-deck virtual PCM devices for Pi DVS.
#
# The DAC8x/ADC8x pair is ONE 8-channel ALSA device per direction (hw:0,0) - each deck's `route` PCM goes via dmix/dsnoop, not straight to
# hw:0,0 (which opens it EXCLUSIVELY, breaking the second deck -). `asym` makes one full-duplex device.
#
# The box is two familiar devices sharing one enclosure, and the outputs say so:
#
#   VINYL THRU (phono)   ports 1-2, channels 0-1 and 2-3 - the box as a turntable
#   DIGITAL OUT (line)   ports 3-4, channels 4-5 and 6-7 - the box as a CDJ
#
# Phono sits on ports 1-2 so each deck's vinyl-thru output is DIRECTLY BELOW that deck's own
# turntable input, making the analogue path physically obvious. It also groups every line-level
# jack on the box - both digital outs, the record input and the spare input - at the far end.
#
# Digital audio ALWAYS leaves at flat line level, whatever the Phono/Line setting says. That is the
# point of this layout: a digital track is never attenuated and inverse-RIAA'd, so it keeps the full
# ~93dB of the 16-bit path instead of the ~47dB that 46dB of digital attenuation left behind.
# Someone with preamp-less Technics gets exactly the same digital quality as anyone else.
#
# The PHONO pair carries passthrough only, and only when the setting says the turntable is
# phono-level: a real record at the level the cartridge produced, needing the mixer's own phono
# stage. On Line the turntable is already line-level, so passthrough rides the line pair alongside
# digital and ports 1-2 go unused.
#
# There is no new idea to learn here - you do not plug a CDJ into a phono input, and the
# phono/line switch on every mixer exists for exactly this reason. Two earlier layouts (one
# switched pair, and both levels on every jack) are in  with why each was wrong.
#
# Input ports: deck 1 on 1, deck 2 on 2, mix record at the far end on 4, port 3 spare.
#
# Reassigned twice for physical reasons, both times to keep the port a deck lands on matching the
# labels on the box: 2026-07-26 for a reorientation in the old enclosure, then twice on 2026-08-23
# for the new one, which mounts the stack upside down and connects straight to the DAC8x/ADC8x
# 3.5mm jacks with no RCA adaptors.
#
# The physical layout is now CONFIRMED (2026-08-30), replacing the previous "established by ear,
# treat as unverified" note. Both the DAC and the ADC run left to right in channel order, facing
# the box:
#
#   port 1 (leftmost) = channels 0-1
#   port 2            = channels 2-3
#   port 3            = channels 4-5
#   port 4            = channels 6-7
#
# Confirmed twice, independently: unplugging the leftmost OUTPUT killed a digital track routed to
# channels 0-1, and a turntable was found arriving on INPUT channels 0-1 from port 1 and on 4-5
# from port 3. The old guesses had these numbered the other way round, which is why deck 1 was
# decoding a pair with nothing on it.
#
# `ctl.dvs_deck1`/`ctl.dvs_deck2` hardcode `card 0` numerically - latent risk.
# period_size/buffer_size here must stay matched with xwax@.service's --buffer/passthrough.js's alsaloop -l - see "Buffer tuning history".
#
# Install:
#   sudo cp asound.conf /etc/asound.conf

pcm.dvs_shared_playback {
    type dmix
    ipc_key 1027
    slave {
        pcm "hw:0,0"
        channels 8
        rate 48000
        format S16_LE
        period_size 64
        buffer_size 2048
    }
}

pcm.dvs_shared_capture {
    type dsnoop
    ipc_key 1028
    slave {
        pcm "hw:0,0"
        channels 8
        rate 48000
        format S16_LE
        period_size 64
        buffer_size 2048
    }
}

# The mix record input - physical port 4, ADC channels 6-7. Deliberately at the far end with port
# 3 left empty between it and deck 2, so the two deck inputs sit together and the record feed is
# unmistakably separate by touch in a dark booth.
#
# Deduced rather than measured: channels 4-5 and 6-7 were confirmed by ear as ports 3 and 4
# (2026-08-23), and channels 0-1 sounded from an INNER jack when deck 2 briefly sat there, which
# rules them out as port 1. Ports 1 and 2 are therefore swapped relative to the obvious
# channel-pair ordering, which is precisely why the first attempt that day landed wrong. If a
# recording turns out silent, this pair is the first thing to suspect.
#
# Reads through the same dsnoop layer as the decks - that is what dsnoop is for, and it means
# recording never competes with a deck for the capture device itself.
pcm.dvs_record_capture {
    type route
    slave {
        pcm "dvs_shared_capture"
        channels 8
    }
    ttable.0.6 1
    ttable.1.7 1
}

# xwax's own output, always the LINE pair - digital audio is never emitted at phono level.
pcm.dvs_deck1_playback {
    type route
    slave {
        pcm "dvs_shared_playback"
        channels 8
    }
    ttable.0.4 1
    ttable.1.5 1
}

# Passthrough destinations, picked by the Phono/Line setting (see passthrough.js). _line is
# deliberately the same pair as _playback: a line-level turntable needs no jack of its own.
pcm.dvs_deck1_line {
    type route
    slave {
        pcm "dvs_shared_playback"
        channels 8
    }
    ttable.0.4 1
    ttable.1.5 1
}

pcm.dvs_deck1_phono {
    type route
    slave {
        pcm "dvs_shared_playback"
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
}

# Port 1, directly above deck 1's own phono output, so a deck's in and out are the same jack
# position on each row.
pcm.dvs_deck1_capture {
    type route
    slave {
        pcm "dvs_shared_capture"
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
}

pcm.dvs_deck1 {
    type asym
    playback.pcm "dvs_deck1_playback"
    capture.pcm "dvs_deck1_capture"
}

ctl.dvs_deck1 {
    type hw
    card 0
}

# xwax's own output, always the LINE pair - digital audio is never emitted at phono level.
pcm.dvs_deck2_playback {
    type route
    slave {
        pcm "dvs_shared_playback"
        channels 8
    }
    ttable.0.6 1
    ttable.1.7 1
}

# Passthrough destinations, picked by the Phono/Line setting (see passthrough.js). _line is
# deliberately the same pair as _playback: a line-level turntable needs no jack of its own.
pcm.dvs_deck2_line {
    type route
    slave {
        pcm "dvs_shared_playback"
        channels 8
    }
    ttable.0.6 1
    ttable.1.7 1
}

pcm.dvs_deck2_phono {
    type route
    slave {
        pcm "dvs_shared_playback"
        channels 8
    }
    ttable.0.2 1
    ttable.1.3 1
}

# Port 2, beside deck 1 and above deck 2's own phono output.
pcm.dvs_deck2_capture {
    type route
    slave {
        pcm "dvs_shared_capture"
        channels 8
    }
    ttable.0.2 1
    ttable.1.3 1
}

pcm.dvs_deck2 {
    type asym
    playback.pcm "dvs_deck2_playback"
    capture.pcm "dvs_deck2_capture"
}

ctl.dvs_deck2 {
    type hw
    card 0
}
